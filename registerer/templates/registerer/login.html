<!DOCTYPE html>
{% extends "spot_items/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div style="margin-top: 35px; display: flex; justify-content: center; align-items: center;">
    <div style="width: 86%;">
        <form method="POST" autocomplete="off" style="background-color: transparent; border: none;">
            {% csrf_token %}
            <fieldset>
                <legend class="text-center mb-4" style="color: #50ACE4;">Log In</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="text-center">
                <button class="btn btn-danger btn-lg w-100" type="submit" style="padding: 15px;">Login</button>
            </div>
        </form>
        <div class="text-center">
            <small>
                Need an account?
                <a href="{% url 'registerer:register' %}" class="text-primary" style="text-decoration: none;">Sign Up Now</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
