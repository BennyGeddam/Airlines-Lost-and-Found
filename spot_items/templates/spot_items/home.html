<!DOCTYPE html>
{% extends "spot_items/base.html" %}
{% block content %}
<div class="container">
    <div class="row">
        {% if items|length > 0 %}
        {% for item in items %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <a href="{% url 'spot_items:detail' item.pk %}">
                    <img src="{{ item.image.url }}" alt="The Lost Item" class="card-img">
                </a>
                <div class="card-body">
                    <h5 class="card-title">{{ item.title }}</h5>
                    <p class="card-text">{{ item.description }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
        {% else %}
        <h1 class="text-center text-white">There Are No Reported Items!</h1>
        {% endif %}
    </div>
</div>
{% endblock %}
