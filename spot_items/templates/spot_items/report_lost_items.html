<!DOCTYPE html>
{% extends "spot_items/base.html" %}
{% load crispy_forms_tags %}
{% block title %}Report Lost Items{% endblock %}
{% block content %}
<div>
    <h2>Report Lost Item</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-dark">Post here</button>
    </form>
</div>
{% endblock %}
